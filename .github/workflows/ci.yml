name: Source-only checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libsdl2-dev libgl1-mesa-dev ffmpeg python3-tk xvfb xauth
          ./setup.sh
      - name: Build, synthetic regressions and complete source audit
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: make verify
      - name: Verify SDL mouse capture on a virtual desktop
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          SDL_VIDEODRIVER: x11
        run: xvfb-run -a .venv/bin/python -m unittest tests.test_graphics
